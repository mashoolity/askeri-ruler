# Builds the installer + portable zip and publishes them as a GitHub Release
# whenever a version tag (v1.2.3) is pushed. The tag must match the version
# in Cargo.toml. Running the workflow manually builds everything and keeps the
# files as workflow artifacts without creating a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v. Bump the version in Cargo.toml first."
          }

      - name: Unit tests
        run: cargo test --locked

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Code signing (optional). Without it the files are published unsigned
      # and Windows SmartScreen will warn users. To enable, add a step here that
      # installs/authenticates your signing tool and exports SIGN_COMMAND, a
      # command line containing {file}, e.g.:
      #   "SIGN_COMMAND=signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 ... ""{file}""" |
      #     Out-File $env:GITHUB_ENV -Append -Encoding utf8
      # See RELEASING.md.

      - name: Build installer and portable zip
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1

      - name: Build MSIX (for Microsoft Store upload)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\build-msix.ps1 -SkipBuild

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: askeri-ruler-${{ github.ref_name }}
          path: |
            dist/*
            target/msix/*.msix

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Askeri Ruler ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/AskeriRuler-Setup-*.exe
            dist/AskeriRuler-*-portable.zip
            dist/SHA256SUMS.txt
