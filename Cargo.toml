[package]
name = "askeri-ruller"
version = "0.2.0"
edition = "2021"
description = "On-screen 1px rotatable guide line for Windows"

[dependencies.windows]
version = "0.62"
features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Win32_System_Com"]

[dev-dependencies]
# PNG compression for examples/gen_assets.rs (Store logos); not linked into the app.
miniz_oxide = "0.8"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
